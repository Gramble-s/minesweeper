<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minesweeper">
<meta name="theme-color" content="#008080">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Minesweeper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a classic 90s desktop window filling the phone. Title bar, sunken LED/face panel,
   level buttons, a sunken pinch-zoomable minefield, a status bar and the flag toggle.
   Deliberately single-theme: the classic grey look in both light and dark mode. */
:root {
  --desk: #008080;        /* desktop teal */
  --face: #c0c0c0;        /* window grey */
  --hi: #ffffff;          /* bevel highlight */
  --lo: #808080;          /* bevel shadow */
  --dk: #000000;          /* outer shadow, text */
  --title-a: #000080;
  --title-b: #1084d0;
  --title-fg: #ffffff;
  --led-on: #ff0000;
  --led-off: #3a0000;
  --led-bg: #000000;
  --boom: #ff0000;
  --smiley: #ffff00;
  --n1: #0000ff; --n2: #008000; --n3: #ff0000; --n4: #000080;
  --n5: #800000; --n6: #008080; --n7: #000000; --n8: #808080;
  --ui: Tahoma, Verdana, "Segoe UI", system-ui, sans-serif;
  --num: Verdana, Tahoma, Arial, sans-serif;
  color-scheme: light;
  height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
  background: var(--desk);
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--desk); color: var(--dk);
  font: 13px/1.2 var(--ui);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overflow: hidden;
}
.desk {
  height: 100%; box-sizing: border-box;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center;
}

/* Bevels */
.raised  { border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.sunken  { border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.window {
  width: 100%; max-width: 560px; height: 100%; box-sizing: border-box;
  background: var(--face);
  border: 2px solid; border-color: var(--face) var(--dk) var(--dk) var(--face);
  box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--lo);
  padding: 3px;
  display: flex; flex-direction: column; gap: 6px;
}
.titlebar {
  background: linear-gradient(90deg, var(--title-a), var(--title-b));
  color: var(--title-fg); font-weight: 700; font-size: 14px;
  padding: 4px 6px; display: flex; align-items: center; gap: 6px;
}
.titlebar svg { width: 16px; height: 16px; flex: none; }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 4px 6px 6px; }

.panel {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 6px 8px;
}
.led {
  justify-self: start; display: flex; background: var(--led-bg);
  padding: 2px; gap: 1px;
}
.led.right { justify-self: end; }
.led svg { width: 19px; height: 34px; display: block; }
.facebtn {
  width: 46px; height: 46px; padding: 0; background: var(--face); cursor: pointer;
  border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi);
  box-shadow: 0 0 0 1px var(--lo);
  display: grid; place-items: center;
}
.facebtn:active { border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.facebtn svg { width: 32px; height: 32px; }

.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.btn {
  font: 13px/1.15 var(--ui); color: var(--dk); background: var(--face);
  border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi);
  box-shadow: inset -1px -1px 0 var(--lo), inset 1px 1px 0 #dfdfdf;
  padding: 6px 4px 5px; cursor: pointer;
}
.btn small { display: block; font-size: 11px; color: #404040; margin-top: 2px; font-variant-numeric: tabular-nums; }
.btn[aria-pressed="true"], .btn:active {
  border-color: var(--dk) var(--hi) var(--hi) var(--dk);
  box-shadow: inset 1px 1px 0 var(--lo), inset -1px -1px 0 #dfdfdf;
  background: repeating-conic-gradient(var(--face) 0 25%, #d8d8d8 0 50%) 0 0 / 2px 2px;
}
.btn[aria-pressed="true"] { font-weight: 700; }
.btn:focus-visible, .facebtn:focus-visible { outline: 1px dotted var(--dk); outline-offset: -5px; }

.viewport {
  position: relative; flex: 1; min-height: 0;
  overflow: hidden; touch-action: none;
}
.grid {
  position: absolute; left: 0; top: 0;
  display: grid; transform-origin: 0 0;
  grid-auto-rows: var(--cell);
  background: var(--face);
  /* sunken frame drawn outside the box so it never shifts the cells */
  box-shadow: -3px -3px 0 var(--lo), 3px 3px 0 var(--hi), -3px 3px 0 var(--face), 3px -3px 0 var(--face);
  will-change: transform;
}
.c {
  width: var(--cell); height: var(--cell); box-sizing: border-box;
  display: grid; place-items: center; overflow: hidden;
  font: 900 calc(var(--cell) * 0.66)/1 var(--num);
}
.c svg { width: 72%; height: 72%; display: block; }
.c.h {
  background: var(--face);
  border: max(2px, calc(var(--cell) * 0.12)) solid;
  border-color: var(--hi) var(--lo) var(--lo) var(--hi);
}
.c.o, .c.p {
  background: var(--face);
  border-top: 1px solid var(--lo); border-left: 1px solid var(--lo);
}
.c.x { background: var(--boom); }
.n1 { color: var(--n1) } .n2 { color: var(--n2) } .n3 { color: var(--n3) } .n4 { color: var(--n4) }
.n5 { color: var(--n5) } .n6 { color: var(--n6) } .n7 { color: var(--n7) } .n8 { color: var(--n8) }

.unzoom { position: absolute; top: 6px; right: 6px; width: 40px; height: 40px; padding: 0; font-size: 18px; }

.statusbar { display: flex; gap: 4px; }
.statusbar div { flex: 1; padding: 4px 6px; min-height: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flag { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; font-size: 15px; }
.flag svg { width: 20px; height: 20px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="desk">
  <div class="window">
    <div class="titlebar"><span id="titleIcon"></span>Minesweeper</div>
    <div class="body">
      <div class="panel sunken">
        <div class="led sunken" id="mines" aria-label="Mines left"></div>
        <button class="facebtn" id="face" aria-label="New game"></button>
        <div class="led right sunken" id="timer" aria-label="Seconds"></div>
      </div>

      <div class="levels" id="levels" role="group" aria-label="Difficulty">
        <button class="btn" id="lv-easy" data-level="easy">Beginner<small>9×9 · 10</small></button>
        <button class="btn" id="lv-medium" data-level="medium">Intermediate<small>&nbsp;</small></button>
        <button class="btn" id="lv-hard" data-level="hard">Expert<small>&nbsp;</small></button>
      </div>

      <div class="viewport" id="viewport">
        <div class="grid" id="grid"></div>
        <button class="btn unzoom" id="unzoom" aria-label="Reset zoom" hidden>⤡</button>
      </div>

      <div class="statusbar"><div class="sunken" id="status"></div></div>
      <button class="btn flag" id="flagBtn" aria-pressed="false"><span id="flagIcon"></span><span id="flagLabel">Flag mode: off</span></button>
    </div>
  </div>
</div>

<script>
(() => {
  // Beginner is the classic fixed 9×9. Intermediate and Expert use fewer columns than the
  // originals so cells stay a usable size, then add as many rows as the screen holds,
  // keeping the classic mine density (40/256 ≈ 16%, 99/480 ≈ 21%).
  const LEVELS = {
    easy:   { cols: 9,  rows: 9, mines: 10 },
    medium: { cols: 12, density: 40 / 256 },
    hard:   { cols: 14, density: 99 / 480 },
  };
  const HIDDEN = 0, FLAG = 1, OPEN = 2;
  const MAX_ZOOM = 4;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const $ = id => document.getElementById(id);
  const viewport = $('viewport'), grid = $('grid');

  // ---------- sprites (drawn here, all original) ----------
  const MINE = `<svg viewBox="0 0 16 16"><g stroke="#000" stroke-width="1.4"><line x1="8" y1="1.5" x2="8" y2="14.5"/><line x1="1.5" y1="8" x2="14.5" y2="8"/><line x1="3.4" y1="3.4" x2="12.6" y2="12.6"/><line x1="12.6" y1="3.4" x2="3.4" y2="12.6"/></g><circle cx="8" cy="8" r="4.6" fill="#000"/><rect x="5.6" y="5.6" width="2" height="2" fill="#fff"/></svg>`;
  const FLAG_SVG = `<svg viewBox="0 0 16 16"><path d="M9 2 L3 5 L9 8 Z" fill="#f00"/><rect x="8.3" y="2" width="1.4" height="9" fill="#000"/><rect x="5.5" y="10.5" width="7" height="1.5" fill="#000"/><rect x="3.5" y="12" width="11" height="2" fill="#000"/></svg>`;
  const WRONG = MINE.replace('</svg>', '<g stroke="#f00" stroke-width="1.6"><line x1="2" y1="2" x2="14" y2="14"/><line x1="14" y1="2" x2="2" y2="14"/></g></svg>');

  const FACES = {
    smile: `<path d="M8 15.5 Q13 20.5 18 15.5" fill="none" stroke="#000" stroke-width="1.6"/><circle cx="9.5" cy="10" r="1.6"/><circle cx="16.5" cy="10" r="1.6"/>`,
    oh:    `<circle cx="13" cy="17" r="2.8" fill="none" stroke="#000" stroke-width="1.6"/><circle cx="9.5" cy="10" r="1.6"/><circle cx="16.5" cy="10" r="1.6"/>`,
    cool:  `<path d="M8 16 Q13 20.5 18 16" fill="none" stroke="#000" stroke-width="1.6"/><path d="M5 9 H21 M6 9 h6 v2.5 q-3 2 -6 0 Z M14 9 h6 v2.5 q-3 2 -6 0 Z" stroke="#000" stroke-width="1"/>`,
    dead:  `<path d="M8 19 Q13 14.5 18 19" fill="none" stroke="#000" stroke-width="1.6"/><g stroke="#000" stroke-width="1.5"><line x1="7.5" y1="8" x2="11.5" y2="12"/><line x1="11.5" y1="8" x2="7.5" y2="12"/><line x1="14.5" y1="8" x2="18.5" y2="12"/><line x1="18.5" y1="8" x2="14.5" y2="12"/></g>`,
  };
  const faceSVG = k => `<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="11.5" style="fill:var(--smiley)" stroke="#000" stroke-width="1.3"/>${FACES[k]}</svg>`;

  // 7-segment LED digits
  const SEG = {
    a: '2.5,1 10.5,1 8.5,3 4.5,3', b: '11.5,2 11.5,10.5 10.5,11.5 9.5,10.5 9.5,4',
    c: '11.5,12.5 11.5,21 9.5,19 9.5,13.5 10.5,11.5', d: '2.5,22 10.5,22 8.5,20 4.5,20',
    e: '1.5,12.5 2.5,11.5 3.5,13.5 3.5,19 1.5,21', f: '1.5,2 3.5,4 3.5,10.5 2.5,11.5 1.5,10.5',
    g: '2.5,11.5 4.5,10.5 8.5,10.5 10.5,11.5 8.5,12.5 4.5,12.5',
  };
  const ON = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g' };
  const digit = ch => `<svg viewBox="0 0 13 23">${Object.entries(SEG).map(([s, p]) =>
    `<polygon points="${p}" style="fill:${ON[ch].includes(s) ? 'var(--led-on)' : 'var(--led-off)'}"/>`).join('')}</svg>`;
  const ledCache = {};
  function setLed(el, n) {
    const s = n < 0 ? '-' + String(Math.min(99, -n)).padStart(2, '0') : String(Math.min(999, n)).padStart(3, '0');
    if (ledCache[el.id] === s) return;
    ledCache[el.id] = s;
    el.innerHTML = [...s].map(digit).join('');
  }

  $('titleIcon').innerHTML = MINE;
  $('flagIcon').innerHTML = FLAG_SVG;

  let level, rows, cols, mineCount, cells, status, exploded, startTime, endTime, flags, newBest;
  let flagMode = false, pressing = -1;
  let cellEls = [];

  // ---------- rules ----------
  function neighbours(i) {
    const r = Math.floor(i / cols), c = i % cols, out = [];
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) out.push(nr * cols + nc);
      }
    return out;
  }

  function placeMines(first) {
    const avoid = new Set([first, ...neighbours(first)]);
    let pool = cells.map((_, i) => i).filter(i => !avoid.has(i));
    const m = mineCount;
    if (pool.length < m) pool = cells.map((_, i) => i).filter(i => i !== first);
    for (let k = pool.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [pool[k], pool[j]] = [pool[j], pool[k]];
    }
    for (let k = 0; k < m; k++) cells[pool[k]].mine = true;
    cells.forEach((c, i) => { if (!c.mine) c.adj = neighbours(i).filter(n => cells[n].mine).length; });
  }

  function flood(start) {
    const stack = [start];
    while (stack.length) {
      const i = stack.pop(), c = cells[i];
      if (c.state !== HIDDEN || c.mine) continue;
      c.state = OPEN;
      if (c.adj === 0) for (const n of neighbours(i)) if (cells[n].state === HIDDEN) stack.push(n);
    }
  }

  function reveal(i) {
    if (cells[i].state !== HIDDEN) return;
    if (status === 'ready') { placeMines(i); status = 'playing'; startTime = Date.now(); }
    if (cells[i].mine) return lose(i);
    flood(i);
    checkWin();
  }

  function chord(i) {
    const c = cells[i];
    if (c.state !== OPEN || c.adj === 0) return;
    const around = neighbours(i);
    if (around.filter(n => cells[n].state === FLAG).length !== c.adj) return;
    for (const n of around) {
      if (cells[n].state !== HIDDEN) continue;
      if (cells[n].mine) return lose(n);
      flood(n);
    }
    checkWin();
  }

  function toggleFlag(i) {
    const c = cells[i];
    if (c.state === HIDDEN) { c.state = FLAG; flags++; buzz(); }
    else if (c.state === FLAG) { c.state = HIDDEN; flags--; buzz(); }
  }

  function checkWin() {
    if (cells.some(c => !c.mine && c.state !== OPEN)) return;
    cells.forEach(c => { if (c.mine) c.state = FLAG; });
    flags = mineCount;
    status = 'won'; endTime = Date.now();
    const t = Math.max(1, elapsed());
    const best = bestTime();
    if (!best || t < best) { store.set(bestKey(), String(t)); newBest = true; }
  }

  function lose(i) { exploded = i; status = 'lost'; endTime = Date.now(); buzz(60); }
  const over = () => status === 'won' || status === 'lost';

  function tap(i) {
    if (over() || i < 0) return;
    const s = cells[i].state;
    if (s === OPEN) chord(i);
    else if (flagMode) toggleFlag(i);
    else if (s === HIDDEN) reveal(i);
    render();
  }

  function longPress(i) {
    if (over() || i < 0) return;
    if (cells[i].state === OPEN) chord(i); else toggleFlag(i);
    render();
  }

  function elapsed() {
    if (!startTime) return 0;
    return Math.min(999, Math.floor(((endTime || Date.now()) - startTime) / 1000));
  }
  const bestKey = () => `ms.best.${level}.${cols}x${rows}`;
  function bestTime() { const v = parseInt(store.get(bestKey()), 10); return v > 0 ? v : null; }

  // Board size for a level on the current screen.
  function dims(key) {
    const L = LEVELS[key];
    if (L.rows) return { cols: L.cols, rows: L.rows, mines: L.mines };
    const cell = Math.floor((vp.w - 2 * FRAME) / L.cols);
    const r = Math.max(L.cols, Math.floor((vp.h - 2 * FRAME) / Math.max(1, cell)));
    return { cols: L.cols, rows: r, mines: Math.round(L.density * L.cols * r) };
  }

  function updateLabels() {
    document.querySelectorAll('#levels button').forEach(b => {
      const d = dims(b.dataset.level);
      b.querySelector('small').textContent = `${d.cols}×${d.rows} · ${d.mines}`;
    });
  }
  function buzz(ms = 8) { try { navigator.vibrate && navigator.vibrate(ms); } catch {} }

  // ---------- setup ----------
  function setLevel(key) {
    level = LEVELS[key] ? key : 'easy';
    ({ rows, cols, mines: mineCount } = dims(level));
    updateLabels();
    store.set('ms.level', level);
    document.querySelectorAll('#levels button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.level === level)));
    grid.style.gridTemplateColumns = `repeat(${cols}, var(--cell))`;
    grid.textContent = '';
    cellEls = [];
    const frag = document.createDocumentFragment();
    for (let i = 0; i < rows * cols; i++) {
      const d = document.createElement('div');
      d._cls = ''; d._txt = '';
      frag.appendChild(d); cellEls.push(d);
    }
    grid.appendChild(frag);
    zoom = 1; origin = { x: 0, y: 0 };
    newGame();
    layout();
  }

  function newGame() {
    cells = Array.from({ length: rows * cols }, () => ({ mine: false, adj: 0, state: HIDDEN }));
    status = 'ready'; exploded = -1; startTime = null; endTime = null; flags = 0; newBest = false;
    pressing = -1;
    render();
  }

  // ---------- drawing ----------
  function render() {
    const lost = status === 'lost';
    for (let i = 0; i < cells.length; i++) {
      const c = cells[i];
      let cls, txt = '';
      const shownMine = lost && c.mine && c.state !== FLAG;
      if (c.state === OPEN || shownMine) {
        cls = 'c o' + (i === exploded ? ' x' : '');
        if (c.mine) txt = MINE;
        else if (c.adj) { cls += ' n' + c.adj; txt = String(c.adj); }
      } else if (c.state === FLAG) {
        cls = 'c h';
        txt = lost && !c.mine ? WRONG : FLAG_SVG;
      } else {
        cls = i === pressing ? 'c p' : 'c h';
      }
      if (lost && c.state === FLAG && !c.mine) cls = 'c o';
      const el = cellEls[i];
      if (el._cls !== cls) { el.className = cls; el._cls = cls; }
      if (el._txt !== txt) { el.innerHTML = txt; el._txt = txt; }
    }
    setLed($('mines'), mineCount - flags);
    setLed($('timer'), elapsed());
    const faceKey = status === 'won' ? 'cool' : lost ? 'dead' : pressing >= 0 ? 'oh' : 'smile';
    if ($('face')._k !== faceKey) { $('face').innerHTML = faceSVG(faceKey); $('face')._k = faceKey; }
    const best = bestTime();
    $('status').textContent =
      status === 'won' ? `Cleared in ${elapsed()} seconds${newBest ? ' · new best!' : ''}` :
      lost ? 'Game over. Tap the face to play again.' :
      (best ? `Best: ${best}s · ` : '') + 'Hold to flag · Pinch to zoom';
  }

  setInterval(() => { if (status === 'playing') setLed($('timer'), elapsed()); }, 250);

  function setPressing(i) {
    const v = i >= 0 && !over() && !flagMode && cells[i] && cells[i].state === HIDDEN ? i : -1;
    if (v !== pressing) { pressing = v; render(); }
  }

  // ---------- zoom & pan ----------
  let zoom = 1, origin = { x: 0, y: 0 }, vp = { w: 0, h: 0 }, livePos = { x: 0, y: 0 };
  const FRAME = 4;   // room for the sunken frame around the field

  const baseCell = () => Math.max(1, Math.floor(Math.min((vp.w - 2 * FRAME) / cols, (vp.h - 2 * FRAME) / rows)));
  const laidSize = z => { const s = baseCell() * z; return { w: s * cols, h: s * rows }; };

  function clamp(p, size) {
    const ax = (v, c, view) => c + 2 * FRAME <= view ? (view - c) / 2 : Math.min(FRAME, Math.max(view - c - FRAME, v));
    return { x: ax(p.x, size.w, vp.w), y: ax(p.y, size.h, vp.h) };
  }

  function layout(scale = 1, pos = null) {
    const laid = laidSize(zoom);
    grid.style.setProperty('--cell', baseCell() * zoom + 'px');
    const p = clamp(pos || origin, { w: laid.w * scale, h: laid.h * scale });
    livePos = p;
    if (!pos) origin = p;
    grid.style.transform = `translate(${p.x}px, ${p.y}px) scale(${scale})`;
    $('unzoom').hidden = zoom <= 1.01;
  }

  new ResizeObserver(() => {
    const r = viewport.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) return;
    vp = { w: r.width, h: r.height };
    if (!level) return setLevel(store.get('ms.level') || 'easy');   // first measurement
    // Refit the board to the screen, but never in the middle of a game.
    const d = dims(level);
    if (status === 'ready' && (d.rows !== rows || d.cols !== cols)) setLevel(level);
    else { updateLabels(); layout(); }
  }).observe(viewport);

  function cellAt(x, y) {
    const r = grid.getBoundingClientRect();
    if (x < r.left || y < r.top || x >= r.right || y >= r.bottom) return -1;
    const c = Math.floor((x - r.left) / (r.width / cols));
    const rr = Math.floor((y - r.top) / (r.height / rows));
    return rr * cols + c;
  }

  // ---------- touch handling ----------
  // One finger: tap = dig, hold 0.3s = flag, move > 8px = pan.
  // Two fingers: pinch zoom around the fingers. Nothing that moved ever counts as a tap.
  const pts = new Map();
  let mode = null, pressCell = -1, pressTimer = null, longFired = false;
  let start = null, pinch = null, liveScale = 1;

  const mid = () => { const [a, b] = [...pts.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
  const local = p => { const r = viewport.getBoundingClientRect(); return { x: p.x - r.left, y: p.y - r.top }; };

  viewport.addEventListener('pointerdown', e => {
    if (e.target.closest('.unzoom')) return;
    try { viewport.setPointerCapture(e.pointerId); } catch {}
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) {
      mode = 'press'; longFired = false;
      start = { x: e.clientX, y: e.clientY, origin: { ...origin } };
      pressCell = cellAt(e.clientX, e.clientY);
      setPressing(pressCell);
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        if (mode === 'press' && pressCell >= 0) { longFired = true; pressing = -1; longPress(pressCell); }
      }, 300);
    } else if (pts.size === 2) {
      clearTimeout(pressTimer);
      setPressing(-1);
      mode = 'pinch';
      pinch = { d0: dist(), m0: local(mid()), o0: { ...origin } };
      liveScale = 1;
    }
  });

  viewport.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (mode === 'press' && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) {
      clearTimeout(pressTimer);
      setPressing(-1);
      mode = 'pan';
    }
    if (mode === 'pan' && pts.size === 1) {
      layout(1, { x: start.origin.x + e.clientX - start.x, y: start.origin.y + e.clientY - start.y });
    } else if (mode === 'pinch' && pts.size >= 2) {
      liveScale = Math.min(Math.max(dist() / pinch.d0, 1 / zoom), MAX_ZOOM / zoom);
      const m = local(mid());
      layout(liveScale, {
        x: m.x - (pinch.m0.x - pinch.o0.x) * liveScale,
        y: m.y - (pinch.m0.y - pinch.o0.y) * liveScale,
      });
    }
  });

  function pointerEnd(e) {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (mode === 'press' && pts.size === 0) {
      clearTimeout(pressTimer);
      pressing = -1;
      if (!longFired && e.type === 'pointerup') tap(pressCell); else render();
      mode = null;
    } else if (mode === 'pan' && pts.size === 0) {
      origin = livePos; mode = null;
    } else if (mode === 'pinch' && pts.size < 2) {
      zoom = Math.min(Math.max(zoom * liveScale, 1), MAX_ZOOM);
      origin = livePos;
      layout();
      mode = pts.size ? 'dead' : null;   // ignore the leftover finger until it lifts
    } else if (mode === 'dead' && pts.size === 0) {
      mode = null;
    }
  }
  viewport.addEventListener('pointerup', pointerEnd);
  viewport.addEventListener('pointercancel', pointerEnd);
  viewport.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());   // stop Safari page zoom

  // ---------- controls ----------
  $('face').addEventListener('click', () => {
    const d = dims(level);
    if (d.rows !== rows || d.cols !== cols) setLevel(level); else newGame();
  });
  $('levels').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b && b.dataset.level !== level) setLevel(b.dataset.level);
  });
  $('flagBtn').addEventListener('click', () => {
    flagMode = !flagMode;
    $('flagBtn').setAttribute('aria-pressed', String(flagMode));
    $('flagLabel').textContent = 'Flag mode: ' + (flagMode ? 'on' : 'off');
  });
  $('unzoom').addEventListener('click', () => { zoom = 1; origin = { x: 0, y: 0 }; layout(); });

  // Offline support when hosted as a web app (ignored where unsupported).
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    const hadWorker = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadWorker && !reloaded) { reloaded = true; location.reload(); }   // apply updates straight away
    });
    navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
  }

})();
</script>

</body>
</html>
